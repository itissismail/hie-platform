# Validation Service Specific Configuration
validation:
  hl7:
    # Validation rules configuration
    strict-mode: ${VALIDATION_STRICT_MODE:true}
    validate-segments: ${VALIDATION_VALIDATE_SEGMENTS:true}
    validate-fields: ${VALIDATION_VALIDATE_FIELDS:true}
    validate-datatypes: ${VALIDATION_VALIDATE_DATATYPES:true}

    # Supported HL7 message types for validation
    supported-message-types:
      - ADT^A01
      - ADT^A02
      - ADT^A03
      - ADT^A04
      - ADT^A05
      - ADT^A08
      - ORM^O01
      - ORU^R01
      - SIU^S12
      - SIU^S13

    # Validation timeout in milliseconds
    validation-timeout: ${VALIDATION_TIMEOUT:30000}

    # Maximum message size for validation (in bytes)
    max-message-size: ${VALIDATION_MAX_MESSAGE_SIZE:1048576} # 1MB