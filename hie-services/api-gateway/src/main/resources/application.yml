server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: message-router-ingest
          uri: http://localhost:8081
          predicates:
            - Path=/ingest/**
  datasource:
    url: jdbc:postgresql://localhost:5432/hie_platform
    username: hie_user
    password: hie_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET:mySecretKeyForHIEPlatform2024}

auth:
  service:
    url: http://localhost:8081

#  security:
#    user:
#      name: admin
#      password: admin123
#      roles: ADMIN
hie:
  audit:
    database:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

