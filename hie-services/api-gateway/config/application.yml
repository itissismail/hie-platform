server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://hie-auth-service:8082/oauth2/jwks
  cloud:
    gateway:
      routes:
        - id: message-router-ingest
          uri: http://hie-message-router:8081
          predicates:
            - Path=/intake/**
          filters:
            - name: GatewayAuditFilter
              args:
                service-name: "message-router-service"


        - id: oauth-service-token
          uri: http://hie-auth-service:8082
          predicates:
            - Path=/oauth2/**
#          filters:
#            - name: OAuthAuditGatewayFilter
#              args:
#                service-name: "oAuth-service"

        # Add additional routes below as needed

#      default-filters:
#        - AddResponseHeader=X-Gateway, Routed-Through-API-Gateway

#  datasource:
#    url: jdbc:postgresql://localhost:5432/hie_platform
#    username: hie_user
#    password: hie_password
#    driver-class-name: org.postgresql.Driver
#  jpa:
#    hibernate:
#      ddl-auto: validate
#    show-sql: false

  # R2DBC Configuration for Reactive Database Access
  # R2DBC Configuration for Reactive Database Access
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://hie-postgres:5432/hie_platform}
    username: ${DB_USERNAME:hie_user}
    password: ${DB_PASSWORD:hie_password}
    pool:
      enabled: true
      initial-size: ${DB_POOL_INITIAL_SIZE:10}
      max-size: ${DB_POOL_MAX_SIZE:20}
      max-idle-time: ${DB_POOL_MAX_IDLE_TIME:30m}
      validation-query: ${DB_POOL_VALIDATION_QUERY:SELECT 1}



jwt:
  secret: ${JWT_SECRET:mySecretKeyForHIEPlatform2024}

auth:
  service:
    url: http://hie-auth-service:8082

#  security:
#    user:
#      name: admin
#      password: admin123
#      roles: ADMIN
hie:
  audit:
    database:
      enabled: false

# Enable debug logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    com.hie.platform.gateway.filter: DEBUG



