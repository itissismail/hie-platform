# auth-service/src/main/resources/application.yml
server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hie_platform
    username: hie_user
    password: hie_password
    driver-class-name: org.postgresql.Driver

  security:
    user:
      name: admin
      password: admin123

#  profiles:
#    active: dev
#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
#  security:
#    user:
#      name: admin
#      password: admin123

# Completely disable Spring Security (NOT recommended for production)

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForHIEPlatform2024}
  expiration: 3600

logging:
  level:
    com.hie.auth: DEBUG
    org.springframework.security: DEBUG

