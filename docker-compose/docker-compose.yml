version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: hie-postgres
    environment:
      POSTGRES_DB: hie_platform
      POSTGRES_USER: hie_user
      POSTGRES_PASSWORD: hie_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - hie-network

  # RabbitMQ Message Queue with Persistence
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hie-rabbitmq
    hostname: hie-rabbitmq
    environment:
      # Only use non-deprecated environment variables
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: hie-vhost
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      # Mount data directory for persistence
      - rabbitmq_data:/var/lib/rabbitmq
      # Mount minimal config file
      - ./rabbitmq-config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - hie-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hie-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - hie-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    #image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: hie-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_API_ROOT_ACCESS: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - hie-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client (mc) - Interactive container
  minio-client:
    image: minio/mc:latest
    container_name: hie-minio-client
    depends_on:
      - minio
    networks:
      - hie-network
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://hie-minio:9000 minioadmin minioadmin123;
      echo 'MinIO Client configured successfully!';
      echo 'Available commands:';
      echo '  mc ls myminio                    - List buckets';
      echo '  mc mb myminio/mybucket          - Create bucket';
      echo '  mc admin user svcacct add myminio minioadmin - Create access key';
      echo '  mc admin user svcacct list myminio minioadmin - List access keys';
      echo '';
      echo 'Container will stay running. Use: docker exec -it hie-minio-client sh';
      tail -f /dev/null
      "
    volumes:
      - minio_client_data:/root/.mc

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hie-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - hie-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: hie-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hie-network

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hie-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - hie-network

  # Zipkin Tracing (Alternative)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: hie-zipkin
    ports:
      - "9411:9411"
    networks:
      - hie-network

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - zookeeper

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"

volumes:
  postgres_data:
  rabbitmq_data:
    driver: local
  rabbitmq_logs:  # Added for RabbitMQ log persistence
    driver: local
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  minio_client_data:

networks:
  hie-network:
    driver: bridge
