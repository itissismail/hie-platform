version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: hie-postgres
    environment:
      POSTGRES_DB: hie_platform
      POSTGRES_USER: hie_user
      POSTGRES_PASSWORD: hie_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - hie-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hie-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hie-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hie-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - hie-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: hie-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - hie-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hie-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - hie-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: hie-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hie-network

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hie-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - hie-network

  # Zipkin Tracing (Alternative)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: hie-zipkin
    ports:
      - "9411:9411"
    networks:
      - hie-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  hie-network:
    driver: bridge
