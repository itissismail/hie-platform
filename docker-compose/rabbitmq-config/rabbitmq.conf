# Minimal RabbitMQ Configuration for Persistence
# Modern syntax for RabbitMQ 3.x

# Memory watermark (40% of available RAM)
vm_memory_high_watermark.relative = 0.4

# Disk free space limit
disk_free_limit.absolute = 1GB

# Logging
log.console = true
log.console.level = info
log.file = true
log.file.level = info

# Ensure management plugin works
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Connection limits
num_acceptors.tcp = 10